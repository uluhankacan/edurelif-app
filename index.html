<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduRelief - Direct Debt Pay</title>
    <!-- Tailwind CSS Script -->
    <script src="[https://cdn.tailwindcss.com"></script]https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 text-gray-900">
    <div id="root"></div>

    <!-- Import Map to let browser resolve React modules cleanly -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18?dev",
          "react-dom": "https://esm.sh/react-dom@18?dev",
          "react-dom/client": "https://esm.sh/react-dom@18?client"
        }
      }
    </script>

    <!-- Load Babel standalone to compile JSX on the fly -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Load App.jsx as an executable module -->
    <script type="text/babel" data-type="module" src="./App.jsx"></script>
  </body>
</html>
